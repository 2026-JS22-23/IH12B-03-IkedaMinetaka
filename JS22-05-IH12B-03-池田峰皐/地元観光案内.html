<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>池田の地元観光案内</title>
  <style>
    /*
      1. 全画面表示にするための基本レイアウトを作る
      2. 左側メニュー用のスタイルを用意する
      3. マーカークリック時の簡易表示と Modal 用の見た目を整える
      4. 画面サイズが変わっても見やすいようにレスポンシブ対応を考える
    */

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      overflow: hidden;
    }

    /*
      1. 地図を画面全体に表示するためのコンテナを用意する
      2. 左側メニューが重ならないように配置を考える
    */
    #map {
      width: 100vw;
      height: 100vh;
      background: #eaf4ff;
    }

    /*
      1. ハンバーガーメニューを左上に配置する
      2. メニュー開閉時に表示内容を切り替えるための枠を用意する
    */
    .menu-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 10px 12px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: left 0.2s ease;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100vh;
      padding: 20px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
      z-index: 99;
      display: none;
    }

    /*
      1. カテゴリー検索・キーワード検索・表示切替などの入力欄を並べる
      2. 代表スポットと自分的スポットの切り替えボタンを置く
    */
    .menu-content {
      display: grid;
      gap: 5px;
    }

    .menu-section {
      border-top: 1px solid #ddd;
      padding-top: 5px;
    }
    .menu-section h3 {
      margin: 5px 0;
    }


    /*
      1. spot.json の観光スポットを簡易表示する一覧を整える
      2. サイドメニュー内で見やすいようにカード風の見た目にする
    */
    .simple-display {
      display: grid;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .simple-item {
      padding: 12px 12px;
      border: 1px solid #bbb;
      border-radius: 10px;
      background: #fafafa;
    }

    .simple-item-button {
      width: 100%;
      border: none;
      background: transparent;
      padding: 5px;
      border:1px solid #bbb;
      text-align: left;
      cursor: pointer;
    }

    .simple-item-button:focus-visible {
      outline: 2px solid #0f766e;
      outline-offset: 2px;
      border-radius: 10px;
    }

    .simple-item h4 {
      margin: 0 0 4px;
      font-size: 14px;
    }

    .simple-item p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #555;
    }

    .simple-item .simple-meta {
      margin-top: 6px;
      font-size: 11px;
      color: #0f766e;
    }


    /*
      1. 詳細表示用の Modal を作る
      2. 画面を広く使って詳細情報を見せるためのレイアウトを用意する
    */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    .modal-close {
      border: none;
      background-color:white;
      float: right;
      cursor: pointer;
      font-size: 20px;
    }

  </style>
</head>
<body>
  <!--
    1. ハンバーガーメニューのボタンを置く
    2. クリックで左側メニューを開閉する
  -->
  <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>

  <!--
    1. 左側に検索・絞り込み・表示切替などのメニューを置く
    2. 初期状態では非表示にしておき、ボタンで開く
  -->
  <aside class="side-menu">
    <div class="menu-content">
      <h2>観光スポット検索</h2>

      <div class="menu-section">
        <h3>検索</h3>
        <!-- 1. キーワード検索用の入力欄を置く -->
        <input type="text" placeholder="キーワードを入力..." />
        <button type="button">検索</button>
      </div>

      <div class="menu-section">
        <h3>カテゴリ</h3>
        <!-- 選択中のカテゴリを表示する -->
        <p>選択中のカテゴリ：<span id="selectCategory">すべて</span></p>
        <button type="button" data-filter="すべて">すべて</button>
        <button type="button" data-filter="自然">自然</button>
        <button type="button" data-filter="観光">観光</button>
        <button type="button" data-filter="食事">食事</button>
        <button type="button" data-filter="買い物">買い物</button>
        <button type="button" data-filter="学校">学校</button>
        <button type="button" data-filter="リラックス">リラックス</button>
      </div>

      <div class="menu-section">
        <h3>表示切替</h3>
        <!-- 選択中の表示タイプを表示する -->
        <p>選択中の表示タイプ：<span id="selectType">すべて</span></p>
        <button type="button" data-type="すべて">すべて</button>
        <button type="button" data-type="代表スポット">代表スポット</button>
        <button type="button" data-type="自分的スポット">自分的スポット</button>
      </div>

      <!--
        1. spot.json のスポットを簡易表示で一覧にする
        2. 名前・説明・カテゴリを確認しやすくする
      -->
      <!-- 観光スポットの簡易表示 -->
      <div class="simple-display"></div>

    </div>
  </aside>

  <!--
    1. 地図本体を表示する場所を用意する
    2. 後で Google Maps API で地図を描画する
  -->
  <div id="map"></div>


  <!--
    1. 詳細表示用の Modal を置く
    2. ここに画像・住所・営業時間・公式サイトリンク・思い出などを表示する
  -->
  <div class="modal">
    <div class="modal-content">
      <button class="modal-close">×</button>
      <h2 id="modalTitle">詳細情報</h2>
      <div id="modalBody">
        <!-- 1. ここにスポットの詳細内容を入れる -->
      </div>
    </div>
  </div>

  <!--
    1. jQuery を読み込む
    2. Google Maps API を読み込む
    3. ここから JavaScript の処理を追加していく
    4. spot.json からスポット情報を取得してマーカーを描画する
  -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // 1. 地図・マーカー・現在選択中のスポットを管理する変数を用意する
    let map;
    let markers = [];
    let markerBySpotId = new Map();
    let currentSpot = null;
    let infoWindow = null;
    let infoWindowCloseTimer = null;
    let spots = [];

    // 2. 検索条件をまとめて保持する
    const filterState = {
      keyword: "",
      category: "すべて",
      type: "すべて"
    };

    // 3. Google Maps API の読み込み完了後に地図を初期化する
    function initMap() {
      const center = { lat: 35.21214992756284, lng: 136.93453300828747 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: center,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false,
        styles: [
          {
            featureType: "poi",
            elementType: "labels",
            stylers: [{ visibility: "off" }]
          },
          {
            featureType: "poi",
            elementType: "labels.icon",
            stylers: [{ visibility: "off" }]
          },
          {
            featureType: "transit",
            elementType: "labels.icon",
            stylers: [{ visibility: "off" }]
          }
        ]
      });

      infoWindow = new google.maps.InfoWindow({
        disableAutoPan: true,
        pixelOffset: new google.maps.Size(0, -34)
      });

      loadSpots();
    }

    // 4. spot.json からスポット情報を取得する
    function loadSpots() {
      $.getJSON("spot.json")
        .done(function(data) {
          spots = Array.isArray(data) ? data : [];
          refreshDisplays();
        })
        .fail(function() {
          spots = [];
          refreshDisplays();
        });
    }

    // 5. 現在の検索条件を反映した一覧とマーカーを再描画する
    function refreshDisplays() {
      renderSimpleSpots();
      renderMarkers();
    }

    // 6. spot.json の内容を簡易表示一覧としてサイドメニューに出す
    function renderSimpleSpots() {
      const simpleDisplay = document.querySelector(".simple-display");
      if (!simpleDisplay) {
        return;
      }

      const visibleSpots = getVisibleSpots();

      simpleDisplay.innerHTML = visibleSpots
        .map((spot) => {
          const typeLabel = spot.type === "自分的スポット" ? "自分的スポット" : "代表スポット";
          return `
            <button type="button" class="simple-item simple-item-button" data-spot-id="${spot.id}">
              <h4>${spot.name}</h4>
              <p>${spot.description || "説明はありません。"}</p>
              <div class="simple-meta">${spot.category || "未分類"} / ${typeLabel}</div>
            </button>
          `;
        })
        .join("");

      simpleDisplay.querySelectorAll(".simple-item-button").forEach((button) => {
        button.addEventListener("click", () => {
          const spotId = Number(button.dataset.spotId);
          focusMarkerBySpotId(spotId);
        });
      });
    }

    // 7. クリックした簡易表示に対応するマーカーへ地図を移動する
    function focusMarkerBySpotId(spotId) {
      const spot = spots.find((item) => Number(item.id) === Number(spotId));
      const marker = markerBySpotId.get(Number(spotId));

      if (!spot || !marker || !map) {
        return;
      }

      map.panTo(marker.getPosition());
      map.setZoom(Math.max(map.getZoom(), 16));
      google.maps.event.trigger(marker, "mouseover");
    }

    // 8. 現在の検索条件に合うスポットだけを取り出す
    function getVisibleSpots() {
      return spots.filter((spot) => {
        const keywordMatch = !filterState.keyword || [spot.name, spot.description, spot.category, spot.address].join(" ").toLowerCase().includes(filterState.keyword.toLowerCase());
        const categoryMatch = filterState.category === "すべて" || spot.category === filterState.category;
        const typeMatch = filterState.type === "すべて" || spot.type === filterState.type;
        return keywordMatch && categoryMatch && typeMatch;
      });
    }

    // 9. Google Maps 用の色名を表示可能な色コードへ変換する
    function normalizeColor(color) {
      if (!color) {
        return "#2e8b57";
      }

      const namedColors = {
        green: "#2e8b57",
        blue: "#2563eb",
        red: "#ef4444",
        orange: "#f59e0b",
        yellow: "#ffff00",
        teal: "#2cb4ad"
      };

      return namedColors[color] || color;
    }

    // 10. ホバー時に表示する簡易情報の内容を作る
    // 11. ここに詳細を見るボタンを入れて、クリック時はモーダルを開く
    function createInfoWindowContent(spot) {
      const typeLabel = spot.type === "自分的スポット" ? "自分的スポット" : "代表スポット";
      return `
        <div style="padding: 4px 6px; min-width: 180px;">
          <!-- 画像を表示させる -->
          <div style="width:250px; margin: 0 auto;"><img id="infoImage" src="${spot.imageUrl || ""}" alt="${spot.name}" style="width: 100%; height: auto; margin-bottom: 8px;" /></div>
          <div style="font-weight: 700; font-size: 15px; margin-bottom: 4px;">${spot.name}</div>
          <div style="font-size: 13px; color: #444; line-height: 1.5;">${spot.description || "説明はありません。"}</div>
          <div style="margin-top: 6px; font-size: 12px; color: #0f766e;">${spot.category || "未分類"} / ${typeLabel}</div>
          <button type="button" class="info-window-detail-button" style="margin-top: 8px; padding: 6px 10px; border: none; border-radius: 6px; background: #0f766e; color: #fff; cursor: pointer;">詳細を見る</button>
        </div>
      `;
    }

    // 12. スポット一覧をもとにマーカーを描画し直す
    function renderMarkers() {
      if (!map || !infoWindow) {
        return;
      }

      markers.forEach((marker) => marker.setMap(null));
      markers = [];
      markerBySpotId = new Map();
      infoWindow.close();

      const visibleSpots = getVisibleSpots();

      visibleSpots.forEach((spot, index) => {
        // マーカー本体を作成する
        const marker = new google.maps.Marker({
          position: { lat: Number(spot.latitude), lng: Number(spot.longitude) },
          map: map,
          title: spot.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 10,
            fillColor: normalizeColor(spot.markerColor),
            fillOpacity: 0.95,
            strokeColor: "#ffffff",
            strokeWeight: 2
          }
        });

        // ホバーしたときにマーカーの上へ簡易情報を出す
        marker.addListener("mouseover", () => {
          currentSpot = spot;
          clearTimeout(infoWindowCloseTimer);
          infoWindow.setContent(createInfoWindowContent(spot));
          infoWindow.open({
            map,
            anchor: marker,
            shouldFocus: false
          });

          // 吹き出しが描画された後に、詳細を見るボタンへイベントを付ける
          google.maps.event.addListenerOnce(infoWindow, "domready", () => {
            const detailButton = document.querySelector(".info-window-detail-button");
            if (detailButton) {
              detailButton.addEventListener("click", () => {
                openModal(spot);
              });
            }

            // 吹き出し内にマウスがある間は閉じないようにする
            const infoWindowElement = document.querySelector(".gm-style-iw");
            if (infoWindowElement) {
              infoWindowElement.addEventListener("mouseenter", () => {
                clearTimeout(infoWindowCloseTimer);
              });

              infoWindowElement.addEventListener("mouseleave", () => {
                infoWindowCloseTimer = setTimeout(() => {
                  infoWindow.close();
                }, 200);
              });
            }
          });
        });

        // マウスが離れたら吹き出しを閉じる
        marker.addListener("mouseout", () => {
          infoWindowCloseTimer = setTimeout(() => {
            infoWindow.close();
          }, 200);
        });

        setTimeout(() => {
          marker.setAnimation(google.maps.Animation.DROP);
        }, index * 120);

        markers.push(marker);
        markerBySpotId.set(Number(spot.id), marker);
      });
    }

    // 13. 詳細表示用のモーダル内容を作成する
    function openModal(spot) {
      document.getElementById("modalTitle").textContent = spot.name;
      const modalBody = document.getElementById("modalBody");
      modalBody.innerHTML = `
        <p><strong>カテゴリ:</strong> ${spot.category || "未分類"}</p>
        <p><strong>区分:</strong> ${spot.type === "自分的スポット" ? "自分的スポット" : "代表スポット"}</p>
        <p><strong>住所:</strong> ${spot.address || "未登録"}</p>
        <p><strong>営業時間:</strong> ${spot.hours || "未登録"}</p>
        <p><strong>説明:</strong> ${spot.description || "未登録"}</p>
        <p><strong>選んだ理由:</strong> ${spot.reason || "未登録"}</p>
        ${spot.websiteUrl ? `<p><a href="${spot.websiteUrl}" target="_blank" rel="noopener">公式サイトを見る</a></p>` : "<p>公式サイトはありません。</p>"}
      `;
      document.querySelector(".modal").style.display = "flex";
    }

    // 14. Google Maps 側から呼べるように初期化関数を公開する
    window.initMap = initMap;

    // 15. ボタン操作や入力操作をまとめて設定する
    $(function() {

      // メニューの開閉を切り替える
      $('.menu-button').on('click', function() {
        $('.side-menu').toggle();
        const isOpen = $('.side-menu').is(':visible');
        $('.menu-button').css('left', isOpen ? '300px' : '20px');
      });

      // モーダルの閉じる操作を設定する
      $('.modal-close, .modal').on('click', function(event) {
        if (event.target === this || event.target.classList.contains('modal-close')) {
          $('.modal').hide();
        }
      });

      // カテゴリで絞り込む
      $('.side-menu button[data-filter]').on('click', function() {
        const category = $(this).data('filter');
        filterState.category = category;
        refreshDisplays();
        updateSelectedCategory();
      });

      //選択中のカテゴリを表示する
      function updateSelectedCategory() {
        const selectedCategory = filterState.category || "すべて";
        $('#selectCategory').text(selectedCategory);
      }

      // 代表スポット / 自分的スポットを切り替える
      $('.side-menu button[data-type]').on('click', function() {
        const type = $(this).data('type');
        filterState.type = type;
        refreshDisplays();
        updateSelectedType();
      });

      //選択中の表示タイプを表示する
      function updateSelectedType() {
        const selectedType = filterState.type || "すべて";
        $('#selectType').text(selectedType);
      }

      // キーワード入力に応じて絞り込む
      $('.side-menu input[type="text"]').on('input', function() {
        filterState.keyword = $(this).val().trim();
        refreshDisplays();
      });

      // 検索ボタンで現在の条件を再描画する
      $('.side-menu button[type="button"]').not('[data-filter]').not('[data-type]').not('.menu-button').on('click', function() {
        refreshDisplays();
      });

    });
  </script>
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAKLjisxFelKwIl1_G6MiEO9-ya7Twr5s&loading=async&callback=initMap"></script>
</body>
</html>
